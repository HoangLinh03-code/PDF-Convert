[general]
inbox = "inbox"
work = "work"
output = "output"
domain = "ai"                # ai | finance

[classify]
min_chars_per_page = 50
scanned_ratio_threshold = 0.9
born_digital_ratio_threshold = 0.1

[mineru]
# MinerU v4 uses "tiers" instead of backends: flash | basic | standard | advanced
# flash   = local CPU server (fast, renders formulas as images)
# standard/advanced = remote mineru.net API (slower, preserves LaTeX $$..$$ text)
# GPU acceleration: handled server-side for standard/advanced; not applicable for flash.
backend_born_digital = "standard"
backend_scanned = "standard"
backend_fallback = ""                # leave empty; standard is already high quality
extra_args = "--wait 600"
restart_server = false               # stop+start local server before each parse run

[llm]
# Google Gemini — see https://ai.google.dev/gemini-api/docs/models
# gemini-3.8-flash: latest recommended (replaces 2.5-flash for new users)
# gemini-2.5-pro:   slower but most accurate for formula-heavy documents
model = "gemini-3.5-flash-lite"
temperature = 0.1
qps = 2
max_retries = 4

[chunk]
target_tokens = 1500
overlap_sentences = 2

[output]
bilingual = true
pandoc_export = false

[qc]
fail_on_number_mismatch = true
