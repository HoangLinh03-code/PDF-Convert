[general]
inbox = "inbox"
work = "work"
output = "output"
domain = "ai"                # ai | finance

[classify]
min_chars_per_page = 50
scanned_ratio_threshold = 0.9
born_digital_ratio_threshold = 0.1

[mineru]
# MinerU v4 uses "tiers" instead of backends: flash | basic | standard | advanced
# Legacy names (pipeline, vlm-transformers, hybrid) are automatically mapped to "flash".
# Local server supports: flash (CPU-based)
# Remote service: basic/standard/advanced (requires --remote + mineru.net account)
backend_born_digital = "pipeline"
backend_scanned = "pipeline"
backend_fallback = ""        # e.g. "standard" for remote higher-quality parse
extra_args = ""

[llm]
# Google Gemini — see https://ai.google.dev/gemini-api/docs/models
# Available models: gemini-2.0-flash, gemini-2.5-flash, gemini-2.5-pro, ...
model = "gemini-3.5-flash-lite"
temperature = 0.1
qps = 4
max_retries = 3

[chunk]
target_tokens = 1500
overlap_sentences = 2

[output]
bilingual = true
pandoc_export = false

[qc]
fail_on_number_mismatch = true
